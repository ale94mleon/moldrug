---
# Codacy analyses everything in the repository by default. What is excluded here is prose:
# the documentation and the notes that come with the repository, plus the deprecated
# folder, which is kept only for reference. The code, including the dashboard under
# streamlit and the scripts under Contrib, stays in the analysis.
#
# Paths use Java glob syntax. This file cannot enable or disable rules, only exclude
# paths: the rules live in pyproject.toml for ruff, and in the Codacy interface for the
# other tools. See .github/MAINTAINING.md.
exclude_paths:
  - "docs/**"
  - "**/*.md"
  - "**/*.rst"
  - ".deprecated/**"
